[project]
name = "cortex"
version = "0.2.0"
description = "Serverless Data Pipeline — Resilient, Cloud-Native Infrastructure Monitoring"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "archsoney" }]

dependencies = [
    "aws-lambda-powertools[tracer]>=3.0.0",
    "aws-xray-sdk>=2.12.0",
    "pydantic>=2.0.0",
    "boto3>=1.35.0",
    "PyJWT>=2.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mangum>=0.17.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[sqs,dynamodb]>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "boto3-stubs[sqs,dynamodb]>=1.35.0",
    "bandit>=1.7.0",
    "python-semantic-release>=9.0.0",
]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: marks tests requiring LocalStack (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/shared/constants.py:__version__"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "echo 'No build command for serverless pipeline'"
